services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mysql:8
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"  # <--- Wrap in double quotes
      MYSQL_DATABASE: "${DB_NAME}"
    ports:
      - "3306:3306"