services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mysql:8
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: your_db_name
    ports:
      - "3306:3306"